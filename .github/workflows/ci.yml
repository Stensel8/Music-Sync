name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Style, types, unused code and tests. The services are faked, so no credentials are needed.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: vulture
      - run: python -m pytest

  # A separate job: a newly published vulnerability must not make the tests look broken.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e '.[web]'
      # Freeze the dependencies before the tools below add their own.
      - run: python -m pip freeze --exclude-editable > "$RUNNER_TEMP/requirements.txt"
      - run: python -m pip install bandit pip-audit
      # -ll: medium and high only. The low ones call names like token_endpoint a hardcoded password.
      - run: bandit -r musicsync -ll
      - run: pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
