{% extends "base.html" %}
{% block title %}Music-Sync — Inloggen{% endblock %}

{% block content %}
<div class="flex min-h-[80vh] items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-base-content mb-2">Music-Sync</h1>
      <p class="text-base-content/50 text-sm">Synchroniseer Spotify naar Tidal</p>
    </div>

    <div class="card bg-base-100 border border-base-300 shadow-lg">
      <div class="card-body gap-4">
        <p class="text-base-content/70 text-sm text-center">Verbind je accounts om te beginnen.</p>

        <a href="{{ url_for('spotify.login') }}" class="btn w-full gap-2" style="background:#1DB954;border-color:#1DB954;color:#000">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
          </svg>
          Inloggen met Spotify
        </a>

        <a href="{{ url_for('tidal.tidal_login') }}" class="btn btn-outline w-full gap-2">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12.012 3.992L8.008 7.996 4.004 3.992 0 7.996l4.004 4.004 4.004-4.004 4.004 4.004 4.004-4.004zM8.008 16.004l4.004-4.004 4.004 4.004L20.02 11.996l-4.004-4.004-4.004 4.004-4.004-4.004-4.004 4.008z"/>
          </svg>
          Inloggen met Tidal
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
